<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempMail - セキュアな完全無料捨てアドサービス</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
  <script>
    let turnstileScriptPromise = null;

    async function loadTurnstileIfNeeded() {
      if (typeof window.turnstile !== 'undefined' && window.turnstile.render) {
        return window.turnstile;
      }

      if (!turnstileScriptPromise) {
        turnstileScriptPromise = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
          script.async = true;
          script.defer = true;
          script.onload = () => resolve(window.turnstile);
          script.onerror = () => reject(new Error('Failed to load Turnstile'));
          document.head.appendChild(script);
        });
      }

      return turnstileScriptPromise;
    }

    async function initTurnstile() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        const siteKey = (data.success && data.turnstileSiteKey) ? data.turnstileSiteKey : '';
        if (siteKey && typeof turnstile !== 'undefined' && turnstile.render) {
          turnstile.render('#turnstileContainer', {
            sitekey: siteKey,
            theme: 'dark',
            callback: function(token) {
              onTurnstileSuccess(token);
            }
          });
        } else {
          const modal = document.getElementById('turnstileModal');
          if (modal) modal.style.display = 'none';
          verifiedTurnstileToken = 'not_required';
        }
      } catch (e) {
        console.error('Failed to initialize Turnstile', e);
        const modal = document.getElementById('turnstileModal');
        if (modal) modal.style.display = 'none';
        verifiedTurnstileToken = 'not_required';
      }
    }
  </script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f43f5e;
      --danger-hover: #e11d48;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .address-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .address-box {
      display: flex;
      align-items: center;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1.1rem;
      word-break: break-all;
    }

    .address-box span {
      flex: 1;
      font-weight: 600;
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background-color: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    button.secondary:hover {
      background-color: var(--border-color);
    }

    button.danger {
      background-color: var(--danger);
      color: #fff;
    }

    button.danger:hover {
      background-color: var(--danger-hover);
    }

    .custom-input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .inbox-header h2 {
      font-size: 1.4rem;
    }

    .badge {
      background: var(--border-color);
      color: var(--text-primary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .email-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .email-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .email-item:hover {
      border-color: var(--accent);
    }

    .email-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .email-from {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .email-time {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .email-subject {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .empty-inbox {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
    }

    .email-viewer {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: none;
    }

    .email-viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .email-viewer-meta div {
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .email-viewer-meta span {
      color: var(--text-secondary);
    }

    .email-body-container {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      max-height: 450px;
      overflow-y: auto;
    }

    .email-body {
      white-space: pre-wrap;
      word-break: break-all;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e2e8f0;
    }

    iframe.email-html-view {
      width: 100%;
      height: 400px;
      border: none;
      background: #ffffff;
      border-radius: 6px;
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .view-tab {
      background: var(--border-color);
      color: var(--text-primary);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .view-tab.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      display: none;
      z-index: 1000;
      animation: fadeInOut 2s ease;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(10px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(10px); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛡️ TempMail Service</h1>
      <p>完全無料・安全・プライベートなセキュア捨てアドサービス（受信専用）</p>
    </header>

    <!-- Address Generator & Management Card -->
    <div class="card" id="mainCard">
      <div class="address-section">
        <label style="color: var(--text-secondary); font-size: 0.9rem;">あなたの現在の捨てアド:</label>
        <div class="address-box">
          <span id="currentAddress">アドレスを作成中...</span>
          <button id="copyBtn" class="secondary" style="padding: 6px 12px; font-size: 0.85rem;">コピー</button>
        </div>
        
        <div class="btn-group">
          <button id="generateBtn">🎲 ランダムアドレス作成</button>
          <button id="deleteMailboxBtn" class="danger">🗑️ アドレスを破棄</button>
        </div>

        <div class="custom-input-group">
          <input type="text" id="customNameInput" placeholder="カスタム名 (例: mymail33)" />
          <button id="createCustomBtn" class="secondary">作成</button>
        </div>
      </div>
    </div>

    <!-- Inbox Card -->
    <div class="card" id="inboxCard">
      <div class="inbox-header">
        <h2>📥 受信トレイ</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
          <span class="badge" id="emailCount">0 通</span>
          <button id="refreshBtn" class="secondary" style="padding: 6px 12px; font-size: 0.85rem;">🔄 更新</button>
        </div>
      </div>

      <div class="email-list" id="emailList">
        <div class="empty-inbox">メールはまだ届いていません。<br>上記のメールアドレス宛てに送信してください。</div>
      </div>
    </div>

    <!-- Email Viewer -->
    <div class="email-viewer" id="emailViewer">
      <div class="email-viewer-header">
        <div class="email-viewer-meta">
          <div id="viewSubject" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;"></div>
          <div><span>From:</span> <strong id="viewFrom"></strong></div>
          <div><span>To:</span> <strong id="viewTo"></strong></div>
          <div><span>Received:</span> <span id="viewTime"></span></div>
        </div>
        <button id="closeViewerBtn" class="secondary">閉じる</button>
      </div>

      <div class="view-tabs" id="viewTabs" style="display: none;">
        <button class="view-tab active" id="tabText" onclick="switchView('text')">テキスト</button>
        <button class="view-tab" id="tabHtml" onclick="switchView('html')">HTML</button>
      </div>

      <div class="email-body-container">
        <div class="email-body" id="viewBodyText"></div>
        <iframe class="email-html-view" id="viewBodyHtml" style="display: none;" sandbox=""></iframe>
      </div>

      <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
        <button id="deleteEmailBtn" class="danger" style="padding: 6px 14px; font-size: 0.85rem;">このメールを削除</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">クリップボードにコピーしました！</div>

  <script>
    let currentMailbox = null;
    let currentEmailId = null;
    let pollInterval = null;
    let verifiedTurnstileToken = null;
    let pendingMailboxCreation = false;
    let pendingMailboxCustomName = '';

    const currentAddressEl = document.getElementById('currentAddress');
    const emailListEl = document.getElementById('emailList');
    const emailCountEl = document.getElementById('emailCount');
    const emailViewerEl = document.getElementById('emailViewer');
    const inboxCardEl = document.getElementById('inboxCard');
    const toastEl = document.getElementById('toast');

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.style.display = 'block';
      setTimeout(() => {
        toastEl.style.display = 'none';
      }, 2000);
    }

    function setNoMailboxState() {
      currentMailbox = null;
      currentAddressEl.textContent = 'アドレスは未作成です';
      emailCountEl.textContent = '0 通';
      emailListEl.innerHTML = '<div class="empty-inbox">まだアドレスは作成されていません。<br>「ランダムアドレス作成」またはカスタム名で作成してください。</div>';
    }

    function buildEmailHtmlDocument(html) {
      const sanitizedHtml = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
      let body = sanitizedHtml;

      try {
        const parser = new DOMParser();
        const parsed = parser.parseFromString(`<body>${sanitizedHtml}</body>`, 'text/html');
        parsed.querySelectorAll('a[href]').forEach((anchor) => {
          anchor.setAttribute('target', '_blank');
          anchor.setAttribute('rel', 'noopener noreferrer');
        });
        body = parsed.body.innerHTML;
      } catch (e) {
        console.error('Failed to normalize email links:', e);
      }

      return `<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; color: #111827; }
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; }
      img, video, canvas, svg { max-width: 100%; height: auto; }
      table { max-width: 100%; border-collapse: collapse; }
      a { color: #0ea5e9; }
    </style>
  </head>
  <body>${body}</body>
</html>`;
    }

    function getTurnstileResponse() {
      if (typeof window.turnstile === 'undefined' || !window.turnstile.getResponse) {
        return null;
      }
      const response = window.turnstile.getResponse();
      return response || null;
    }

    function onTurnstileSuccess(token) {
      verifiedTurnstileToken = token;
      document.getElementById('turnstileModal').style.display = 'none';
      showToast('セキュリティ認証が完了しました！');

      if (pendingMailboxCreation) {
        pendingMailboxCreation = false;
        createMailbox(pendingMailboxCustomName);
      }
    }

    async function createMailbox(customName = '') {
      const resolvedToken = verifiedTurnstileToken || getTurnstileResponse();
      if (resolvedToken) {
        verifiedTurnstileToken = resolvedToken;
      }

      if (!verifiedTurnstileToken) {
        pendingMailboxCustomName = customName;
        pendingMailboxCreation = true;
        const modal = document.getElementById('turnstileModal');
        modal.style.display = 'flex';

        try {
          await loadTurnstileIfNeeded();
          await initTurnstile();
        } catch (e) {
          console.error(e);
          pendingMailboxCreation = false;
          modal.style.display = 'none';
          alert('認証画面の読み込みに失敗しました');
        }
        return;
      }

      if (!verifiedTurnstileToken && typeof window.turnstile !== 'undefined') {
        pendingMailboxCreation = true;
        document.getElementById('turnstileModal').style.display = 'flex';
        return;
      }

      if (!verifiedTurnstileToken) {
        pendingMailboxCreation = false;
        document.getElementById('turnstileModal').style.display = 'none';
        return;
      }

      const turnstileToken = verifiedTurnstileToken;
      try {
        const res = await fetch('/api/mailboxes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customName, turnstileToken })
        });
        const data = await res.json();
        if (data.success) {
          currentMailbox = data.mailbox.address;
          currentAddressEl.textContent = currentMailbox;
          localStorage.setItem('temp_mail_address', currentMailbox);
          fetchEmails();
          showToast('新しいアドレスを作成しました！');
          verifiedTurnstileToken = null;
          pendingMailboxCreation = false;
          pendingMailboxCustomName = '';
          if (typeof window.turnstile !== 'undefined' && window.turnstile.reset) {
            window.turnstile.reset();
          }
        } else {
          alert(data.error || 'アドレスの作成に失敗しました');
          verifiedTurnstileToken = null;
          pendingMailboxCreation = false;
          pendingMailboxCustomName = '';
          if (typeof window.turnstile !== 'undefined' && window.turnstile.reset) {
            window.turnstile.reset();
          }
          document.getElementById('turnstileModal').style.display = 'flex';
        }
      } catch (e) {
        console.error(e);
        alert('サーバーとの通信に失敗しました');
      }
    }

    async function fetchMailboxes() {
      try {
        const saved = localStorage.getItem('temp_mail_address');
        if (saved) {
          const ensureRes = await fetch('/api/mailboxes/ensure', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address: saved })
          });
          const ensureData = await ensureRes.json();
          if (ensureData.success) {
            currentMailbox = ensureData.mailbox.address;
            currentAddressEl.textContent = currentMailbox;
            fetchEmails();
            return;
          }
        }

        const res = await fetch('/api/mailboxes');
        const data = await res.json();
        if (data.success && data.mailboxes.length > 0) {
          currentMailbox = data.mailboxes[0].address;
          currentAddressEl.textContent = currentMailbox;
          localStorage.setItem('temp_mail_address', currentMailbox);
          fetchEmails();
        } else {
          setNoMailboxState();
        }
      } catch (e) {
        console.error(e);
        setNoMailboxState();
      }
    }

    async function fetchEmails() {
      if (!currentMailbox) return;
      try {
        const res = await fetch(`/api/emails?to=${encodeURIComponent(currentMailbox)}`);
        const data = await res.json();
        if (data.success) {
          renderEmails(data.emails);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderEmails(emails) {
      emailCountEl.textContent = `${emails.length} 通`;
      if (emails.length === 0) {
        emailListEl.innerHTML = '<div class="empty-inbox">メールはまだ届いていません。<br>上記のメールアドレス宛てに送信してください。</div>';
        return;
      }

      emailListEl.innerHTML = emails.map(email => `
        <div class="email-item" onclick="openEmail('${email.id}')">
          <div class="email-item-header">
            <span class="email-from">From: ${escapeHtml(email.from)}</span>
            <span class="email-time">${new Date(email.receivedAt).toLocaleTimeString()}</span>
          </div>
          <div class="email-subject">${escapeHtml(email.subject)}</div>
        </div>
      `).join('');
    }

    async function openEmail(id) {
      try {
        const res = await fetch(`/api/emails/${id}`);
        const data = await res.json();
        if (data.success) {
          const email = data.email;
          currentEmailId = email.id;
          document.getElementById('viewSubject').textContent = email.subject;
          document.getElementById('viewFrom').textContent = email.from;
          document.getElementById('viewTo').textContent = email.to;
          document.getElementById('viewTime').textContent = new Date(email.receivedAt).toLocaleString();
          
          document.getElementById('viewBodyText').textContent = email.text || '(テキスト本文なし)';

          const viewTabsEl = document.getElementById('viewTabs');
          const iframeEl = document.getElementById('viewBodyHtml');
          const textEl = document.getElementById('viewBodyText');

          inboxCardEl.style.display = 'none';
          emailViewerEl.style.display = 'block';

          if (email.html) {
            viewTabsEl.style.display = 'flex';
            switchView('html');
            requestAnimationFrame(() => {
              iframeEl.srcdoc = buildEmailHtmlDocument(email.html);
            });
          } else {
            viewTabsEl.style.display = 'none';
            iframeEl.style.display = 'none';
            textEl.style.display = 'block';
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function switchView(type) {
      const textEl = document.getElementById('viewBodyText');
      const iframeEl = document.getElementById('viewBodyHtml');
      const tabText = document.getElementById('tabText');
      const tabHtml = document.getElementById('tabHtml');

      if (type === 'text') {
        textEl.style.display = 'block';
        iframeEl.style.display = 'none';
        tabText.classList.add('active');
        tabHtml.classList.remove('active');
      } else {
        textEl.style.display = 'none';
        iframeEl.style.display = 'block';
        tabHtml.classList.add('active');
        tabText.classList.remove('active');
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Event Listeners
    document.getElementById('copyBtn').addEventListener('click', () => {
      if (!currentMailbox) return;
      navigator.clipboard.writeText(currentMailbox);
      showToast('クリップボードにコピーしました！');
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      localStorage.removeItem('temp_mail_address');
      createMailbox();
    });

    document.getElementById('createCustomBtn').addEventListener('click', () => {
      const val = document.getElementById('customNameInput').value.trim();
      if (val) {
        createMailbox(val);
        document.getElementById('customNameInput').value = '';
      } else {
        alert('カスタム名を入力してください');
      }
    });

    document.getElementById('deleteMailboxBtn').addEventListener('click', async () => {
      if (!currentMailbox || !confirm(`アドレス ${currentMailbox} を破棄しますか？`)) return;
      try {
        await fetch(`/api/mailboxes/${encodeURIComponent(currentMailbox)}`, { method: 'DELETE' });
        localStorage.removeItem('temp_mail_address');
        createMailbox();
      } catch (e) {
        console.error(e);
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      fetchEmails();
      showToast('更新しました');
    });

    document.getElementById('closeViewerBtn').addEventListener('click', () => {
      emailViewerEl.style.display = 'none';
      inboxCardEl.style.display = 'block';
      currentEmailId = null;
    });

    document.getElementById('deleteEmailBtn').addEventListener('click', async () => {
      if (!currentEmailId || !confirm('このメールを削除しますか？')) return;
      try {
        await fetch(`/api/emails/${currentEmailId}`, { method: 'DELETE' });
        emailViewerEl.style.display = 'none';
        inboxCardEl.style.display = 'block';
        currentEmailId = null;
        fetchEmails();
        showToast('メールを削除しました');
      } catch (e) {
        console.error(e);
      }
    });

    fetchMailboxes();

    // Auto refresh every 5 seconds (if mailbox active)
    pollInterval = setInterval(() => {
      if (currentMailbox) fetchEmails();
    }, 5000);
  </script>
